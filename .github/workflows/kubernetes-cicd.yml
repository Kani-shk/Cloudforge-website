
name: CloudForge Kubernetes CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            kanishk040506/cloudforge:latest
            kanishk040506/cloudforge:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Kubernetes configuration
        run: kubectl apply -f k8s/deployment.yaml

      - name: Update Kubernetes image
        run: |
          kubectl set image deployment/cloudforge \
            cloudforge=kanishk040506/cloudforge:${GITHUB_SHA}

      - name: Verify deployment
        run: kubectl rollout status deployment/cloudforge --timeout=120s
