
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudforge
  template:
    metadata:
      labels:
        app: cloudforge
    spec:
      containers:
        - name: cloudforge
          image: kanishk040506/cloudforge:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cloudforge-service
spec:
  type: NodePort
  selector:
    app: cloudforge
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
